<style>
  /* ————————————————————————————————
     Case-study page — same register as the landing page:
     white ground, DM Sans everywhere, Instrument Serif for
     the name alone, one coral accent system, mobile-first,
     the same 68rem desktop enhancement.
     The <main> arrives encrypted (see tools/encrypt-page.mjs)
     and is injected after the password unlocks it; this
     stylesheet is the only design the public repo exposes.
     ———————————————————————————————— */
  :root {
    --paper:  #ffffff;
    --ink:    #3d3833;   /* 11.6:1 */
    --strong: #35302a;   /* 13.1:1 */
    --soft:   #6b6259;   /* 6.0:1 */
    --faint:  #6f665a;   /* 5.6:1 */
    --coral:  #e56749;   /* marks only */
    --terracotta: #c05818;
    --accent: #a64310;   /* link text, 6.1:1 */
    --sage:   #e6f3e5;
    --blush:  #fef1ec;
    --lavender: #efeaf8;
    --hairline: rgb(61 56 51 / 0.16);
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --measure: 38rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "DM Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-optical-sizing: auto;
    font-size: 1.0625rem;
    line-height: 1.65;
    font-kerning: normal;
    hanging-punctuation: first last;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #f3dacb; color: var(--strong); }
  .page { max-width: calc(var(--measure) + 3rem); margin-inline: auto; padding-inline: 1.5rem; }
  p, li, dd, figcaption { text-wrap: pretty; }

  a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-decoration-color: rgb(166 67 16 / 0.35);
    text-underline-offset: 0.18em;
    transition: text-decoration-color 150ms ease-out;
  }
  a:hover { text-decoration-color: var(--terracotta); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; text-decoration: none; }

  /* ——— Top bar: the way back, in her name ——— */
  .top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    padding-top: clamp(1.5rem, 5vh, 3rem);
  }
  .home {
    font-family: var(--display); font-style: italic; font-size: 1.375rem; line-height: 1.2;
    color: var(--strong); text-decoration: none;
  }
  .home .arrow { display: inline-block; margin-right: 0.35em; transition: transform 200ms cubic-bezier(0.23, 1, 0.32, 1); }
  .home:hover .arrow { transform: translateX(-3px); }
  .caps, .site-nav a, .kicker, .when, dt, .tag {
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint);
  }
  .site-nav { display: flex; align-items: center; column-gap: 0.85rem; flex-wrap: wrap; }
  .site-nav a {
    display: inline-flex; align-items: center; min-height: 44px; padding-inline: 0.3rem;
    margin-inline: -0.3rem calc(-0.3rem - 0.16em);
    text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 0.25em;
    color: var(--faint);
  }
  .site-nav a:hover { text-decoration-color: var(--accent); color: var(--accent); }
  .site-nav .sep { color: var(--faint); user-select: none; }

  /* ——— Gate ——— */
  #gate { margin-top: clamp(3.5rem, 14vh, 7rem); max-width: 27rem; }
  #gate .monogram { width: 44px; height: auto; display: block; margin-bottom: 1.4rem; }
  #gate h1 { font-size: 1.35rem; font-weight: 600; line-height: 1.3; color: var(--strong); letter-spacing: -0.005em; }
  #gate p { margin-top: 0.7rem; color: var(--ink); }
  #gate form { display: flex; gap: 0.5rem; margin-top: 1.4rem; }
  #gate label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #gate input {
    flex: 1 1 auto; min-width: 0; min-height: 46px; padding: 0.55rem 0.9rem;
    font: inherit; color: var(--strong); background: #fff;
    border: 1px solid rgb(61 56 51 / 0.28); border-radius: 11px;
    transition: border-color 150ms ease-out;
  }
  #gate input:hover { border-color: rgb(61 56 51 / 0.45); }
  #gate input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-color: transparent; }
  #gate input[aria-invalid="true"] { border-color: var(--terracotta); }
  #gate button {
    min-height: 46px; padding-inline: 1.15rem; border: 0; border-radius: 11px;
    font: inherit; font-weight: 500; color: #fff; background: var(--strong);
    transition: background-color 150ms ease-out, transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  #gate button:hover { background: var(--terracotta); }
  #gate button:active { transform: scale(0.97); }
  #gate button[disabled] { opacity: 0.6; }
  #gate .msg { min-height: 1.6em; margin-top: 0.7rem; font-size: 0.9375rem; color: var(--soft); }
  #gate .msg.err { color: var(--accent); }
  #gate .ask { margin-top: 1.6rem; font-size: 0.9375rem; color: var(--soft); }
  .locked #cs { display: none; }
  html:not(.locked) #gate { display: none; }
  noscript p { margin-top: 1rem; }

  /* ——— Case-study content ——— */
  #cs { margin-top: clamp(2.5rem, 8vh, 4.5rem); }
  .hero .kicker { display: block; margin-bottom: 1rem; }
  .hero h1 {
    font-size: clamp(1.75rem, 1.15rem + 2.6vw, 2.5rem);
    font-weight: 600; line-height: 1.15; letter-spacing: -0.012em; color: var(--strong);
    max-width: 20ch;
  }
  .hero .dek { margin-top: 1.1rem; font-size: 1.15em; line-height: 1.55; }
  .hero .dek + p { margin-top: 0.9rem; }

  .glance {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 1.5rem;
    margin-top: 2.25rem; padding-top: 1.4rem; border-top: 1px solid var(--hairline);
    font-size: 0.9375rem; line-height: 1.5;
  }
  .glance dt { margin-bottom: 0.2rem; }
  .glance dd { color: var(--ink); }

  #cs section { position: relative; margin-top: clamp(3rem, 8vh, 4.25rem); }
  #cs h2 {
    font-size: 1.35rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.008em; color: var(--strong);
    margin-bottom: 0.9rem; max-width: 30ch;
  }
  #cs h2 .num { color: var(--coral); font-weight: 500; margin-right: 0.55em; font-variant-numeric: tabular-nums; }
  #cs h3 { font-size: 1.0625rem; font-weight: 600; color: var(--strong); margin: 1.8rem 0 0.35rem; }
  #cs p + p, #cs ul + p, #cs p + ul { margin-top: 1em; }
  #cs figure + p, #cs figure + h3, #cs dl + p { margin-top: 1.6rem; }   /* prose resumes with air after a caption */
  #cs ul, #cs ol { padding-left: 1.15rem; }
  #cs li + li { margin-top: 0.35em; }
  #cs li::marker { color: var(--faint); }
  #cs strong { font-weight: 600; color: var(--strong); }

  /* the key insight / the reframe: her blush wash, like Now on the landing page */
  .callout {
    background: var(--blush); border-radius: 12px; padding: 1.05rem 1.25rem; margin: 1.4rem -0.75rem 0;
  }
  .callout.sage { background: var(--sage); }
  .callout + p { margin-top: 1.2rem; }
  .callout .who { display: block; margin-top: 0.5rem; font-size: 0.8125rem; color: var(--soft); }

  /* receipts: the numbers, quiet but unmissable */
  .receipts {
    /* 7.5rem lets four receipts sit on one row inside the 38rem measure; phones get a 2×2 */
    display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 1.25rem 1.5rem;
    margin-top: 1.5rem; padding-top: 1.4rem; border-top: 1px solid var(--hairline);
  }
  .receipts .n {
    display: block; font-size: 2.125rem; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; color: var(--strong);
    font-variant-numeric: tabular-nums;
  }
  .receipts .l { display: block; margin-top: 0.4rem; font-size: 0.875rem; line-height: 1.4; color: var(--soft); }

  blockquote { margin: 1.2rem 0 0; padding-left: 1rem; border-left: 2px solid var(--coral); color: var(--ink); }
  blockquote cite { display: block; margin-top: 0.4rem; font-style: normal; font-size: 0.8125rem; color: var(--soft); }

  .qa h3 { margin-top: 1.6rem; }
  .qa h3::before { content: "“"; color: var(--coral); margin-right: 0.1em; }
  .qa h3::after { content: "”"; color: var(--coral); margin-left: 0.1em; }

  /* ——— Figures: the landing page's artifact-card slot ——— */
  .thumbs { margin: 1.5rem 0 0; }
  .thumbs img {
    display: block; width: 100%; height: auto; border-radius: 12px;
    background: var(--blush);              /* the card's wash shows while the bytes decrypt */
  }
  .thumbs .pair { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1rem; }
  .thumbs .pair img { height: 100%; object-fit: cover; }
  .thumbs figcaption { margin-top: 0.6rem; font-size: 0.8125rem; line-height: 1.5; color: var(--faint); font-variant-numeric: tabular-nums; }
  .thumbs figcaption .tag { margin-right: 0.5em; letter-spacing: 0.12em; }

  footer {
    margin-top: clamp(3.5rem, 10vh, 5.5rem);
    padding-block: 1.6rem clamp(3rem, 8vh, 5rem);
    border-top: 1px solid var(--hairline);
  }
  footer .monogram { display: block; width: 48px; height: auto; margin-bottom: 1.1rem; }
  footer .site-nav a { color: var(--accent); }

  /* ——— Desktop enhancement ——— */
  @media (min-width: 68rem) {
    .top { padding-top: clamp(2rem, 6vh, 3.5rem); }
    #cs { margin-top: clamp(3rem, 10vh, 5.5rem); }
    .glance { grid-template-columns: repeat(4, 1fr); }
    .callout { margin-inline: -1.25rem; }
    /* the card overhangs the measure; its caption returns to the text grid */
    .thumbs { margin-inline: -4.5rem; }
    .thumbs figcaption { margin-inline: 4.5rem; }
    #cs section { margin-top: clamp(3.5rem, 9vh, 5rem); }
  }

  /* ——— Micro-interactions + custom cursor (desktop fine-pointers only) ——— */
  @media (hover: hover) and (pointer: fine) {
    html { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path d="M12 1.5 C13.4 7.4 16.6 10.6 22.5 12 C16.6 13.4 13.4 16.6 12 22.5 C10.6 16.6 7.4 13.4 1.5 12 C7.4 10.6 10.6 7.4 12 1.5 Z" fill="%23e56749" stroke="white" stroke-width="1.2"/></svg>') 11 11, auto; }
    a, button { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><path d="M12 1.5 C13.4 7.4 16.6 10.6 22.5 12 C16.6 13.4 13.4 16.6 12 22.5 C10.6 16.6 7.4 13.4 1.5 12 C7.4 10.6 10.6 7.4 12 1.5 Z" fill="%23c05818" stroke="white" stroke-width="1.2"/></svg>') 13 13, pointer; }
    input { cursor: text; }
    .thumbs img { transition: transform 260ms cubic-bezier(0.23, 1, 0.32, 1); }
    .thumbs img:hover { transform: translateY(-5px) scale(1.012); }
    .monogram { transition: transform 200ms ease-out; }
    .monogram:hover { animation: wiggle 500ms ease-in-out; }
  }
  @keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-5deg); } 65% { transform: rotate(4deg); } }
  .cursor-dot {
    position: fixed; top: 0; left: 0; width: 9px; height: 9px; border-radius: 50%;
    background: var(--coral); pointer-events: none; z-index: 999; opacity: 0; translate: -50% -50%;
    transition: opacity 200ms ease-out, width 180ms ease-out, height 180ms ease-out, background-color 180ms ease-out, border-color 180ms ease-out;
    will-change: transform;
  }
  .cursor-dot.is-link { width: 30px; height: 30px; background: transparent; border: 1.5px solid var(--coral); }

  @media (prefers-reduced-motion: no-preference) {
    .top, #gate, #cs, footer { animation: settle 0.45s ease-out both; }
    #gate, #cs { animation-delay: 0.08s; }
    footer { animation-delay: 0.16s; }
    @keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #gate.shake { animation: shake 320ms ease-out; }
    @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    body { font-size: 10.5pt; line-height: 1.5; }
    .site-nav, .cursor-dot, #gate { display: none; }
    .thumbs img { break-inside: avoid; }
    a { color: var(--ink); }
    @page { margin: 1.8cm; }
  }
</style>
</head>

<div class="page">

  <div class="top">
    <a class="home" href="../"><span class="arrow" aria-hidden="true">←</span>Avantika Pidiha</a>

  <section id="gate" aria-labelledby="gate-h">
    <img class="monogram" src="../assets/ap-monogram-128.png" alt="" width="128" height="127">
    <h1 id="gate-h">This case study is password-protected.</h1>
    <p>It's client work, so I share it on request. If you have the password, it opens here — the page decrypts in your browser and nothing is sent anywhere.</p>
    <form id="unlock" autocomplete="off" novalidate>
      <label for="pw">Password</label>
      <input id="pw" type="password" placeholder="Password" autocapitalize="none" spellcheck="false" required>
      <button type="submit">Open</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <p class="ask">Don't have it? <a href="mailto:avantikapidiha28@gmail.com?subject=Lenskart%20case%20study">Email me</a> and I'll send it the same day.</p>
    <noscript><p>This page needs JavaScript to decrypt the case study.</p></noscript>
  </section>

  <main id="cs"></main>

  <footer>
    <img class="monogram" src="../assets/ap-monogram-128.png" alt="AP monogram" width="128" height="127" loading="lazy">
    <nav class="site-nav" aria-label="Footer">

      <span class="sep" aria-hidden="true">·</span>
      <a href="../resume.pdf">Resume</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="mailto:avantikapidiha28@gmail.com">Email</a>
    </nav>

<script>
/* Unlock: PBKDF2-SHA256 → AES-256-GCM, all WebCrypto, all client-side.
   The HTML and every image are separate ciphertexts under one key. */
(() => {
  const root = document.documentElement;
  const payloadEl = document.getElementById('payload');
  const gate = document.getElementById('gate');
  const form = document.getElementById('unlock');
  const pw = document.getElementById('pw');
  const msg = document.getElementById('msg');
  const cs = document.getElementById('cs');
  if (!payloadEl) return;                       // preview build: content is already in place
  const p = JSON.parse(payloadEl.textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(p.salt), iterations: p.it },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  const open = (key, bytes) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));

  async function reveal(key) {
    const html = new TextDecoder().decode(await open(key, b64(p.html)));
    cs.innerHTML = html;
    root.classList.remove('locked');
    document.title = (cs.querySelector('h1')?.textContent || 'Lenskart') + ' — Avantika Pidiha';
    // stream the images in: fetch → decrypt → blob URL, in document order
    for (const img of cs.querySelectorAll('img[data-enc]')) {
      fetch(img.dataset.enc).then(r => r.arrayBuffer())
        .then(buf => open(key, new Uint8Array(buf)))
        .then(clear => { img.src = URL.createObjectURL(new Blob([clear], { type: img.dataset.type || 'image/png' })); })
        .catch(() => { img.alt = (img.alt || 'Image') + ' (could not load)'; });
    }
  }

  let inflight = false;
  async function attempt(password, quiet) {
    if (!crypto.subtle) { msg.textContent = 'This browser can\'t decrypt the page (it needs a secure context).'; msg.className = 'msg err'; return; }
    if (inflight || !root.classList.contains('locked')) return;   // one attempt at a time; never re-reveal
    inflight = true;
    form.querySelector('button').disabled = true;
    if (!quiet) { msg.textContent = 'Opening…'; msg.className = 'msg'; }
    try {
      const key = await deriveKey(password);
      await reveal(key);
      try { sessionStorage.setItem('lenskart', password); } catch (e) {}
    } catch (e) {
      if (!quiet) {
        msg.textContent = 'That password didn\'t work.'; msg.className = 'msg err';
        pw.setAttribute('aria-invalid', 'true'); pw.select();
        gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
      }
    } finally { form.querySelector('button').disabled = false; inflight = false; }
  }

  form.addEventListener('submit', e => { e.preventDefault(); if (pw.value) attempt(pw.value, false); });
  pw.addEventListener('input', () => { pw.removeAttribute('aria-invalid'); if (msg.classList.contains('err')) { msg.textContent = ''; msg.className = 'msg'; } });
  try { const saved = sessionStorage.getItem('lenskart'); if (saved) attempt(saved, true); } catch (e) {}
})();

/* Trailing coral dot — same as the landing page; link detection is
   delegated so links that arrive after unlock light it up too. */
(() => {
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dot = document.createElement('div');
  dot.className = 'cursor-dot'; dot.setAttribute('aria-hidden', 'true');
  document.body.appendChild(dot);
  let x = -100, y = -100, cx = -100, cy = -100, seen = false;
  addEventListener('pointermove', e => { x = e.clientX; y = e.clientY; if (!seen) { cx = x; cy = y; seen = true; dot.style.opacity = 1; } }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { dot.style.opacity = 0; });
  document.documentElement.addEventListener('mouseenter', () => { if (seen) dot.style.opacity = 1; });
  document.addEventListener('mouseover', e => { dot.classList.toggle('is-link', !!e.target.closest('a, button')); });
  const loop = () => { cx += (x - cx) * 0.16; cy += (y - cy) * 0.16; dot.style.transform = `translate(${cx}px, ${cy}px)`; requestAnimationFrame(loop); };
  loop();
})();
</script>
